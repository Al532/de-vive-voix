<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Importer une partition — De vive voix</title>
<link rel="stylesheet" href="lab.css?v=interface-simple-1">
<script src="vendor/fflate.js" defer></script><script src="musicxml-import.js" defer></script>
<script src="phonetics-engine.js" defer></script><script src="practice-library.js?v=bundled-1" defer></script>
<script src="import-speech.js" defer></script><script src="score-navigation.js?v=1" defer></script>
<script src="importer.js?v=piece-menu-1" defer></script>
</head>
<body><main>
<header><h1>Importer une partition</h1></header>
<form id="importForm">
<label for="scoreFile">Fichier MusicXML</label>
<input id="scoreFile" type="file" accept=".musicxml,.xml,.mxl" required aria-describedby="fileHint">
<p id="fileHint" class="hint">Formats .musicxml, .xml et .mxl. Le fichier reste sur cet appareil.</p>
<label for="importLanguage">Langue principale des paroles</label>
<select id="importLanguage"><option value="auto">Reconnaissance automatique</option><option value="la">Latin italien et grec liturgique</option><option value="fr">Français</option><option value="it">Italien</option><option value="de">Allemand</option><option value="en-US">Anglais américain</option></select>
<button id="importButton" class="primary wide" type="submit">Préparer le morceau</button>
</form>
<button id="cancelImport" type="button" hidden>Annuler la préparation</button>
<p id="importStatus" role="status"></p><p id="importProgress" aria-live="off"></p><div id="importResult" hidden></div>
<button id="returnButton" type="button" class="wide">Retour</button>
<noscript>JavaScript est nécessaire pour préparer une partition. <a href="index.html">Retour</a></noscript>
</main></body></html>
