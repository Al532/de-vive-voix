name: Vérifier et publier De vive voix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-audio:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.persist.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer le moteur de génération
        run: python -m pip install numpy espeakng-loader==0.2.4
      - name: Remplacer le catalogue par des sons à 175
        run: python tools/catalogue/replace-rate.py --source dist/catalogue-audio --output dist/catalogue-audio
      - name: Retirer les anciennes vitesses
        run: python tools/catalogue/prune-speech-variants.py
      - name: Vérifier tous les fichiers du catalogue
        run: python tools/catalogue/verify.py dist/catalogue-audio
      - name: Conserver les nouveaux sons dans le dépôt
        id: persist
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --exit-code -- dist
            echo "revision=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A -- dist
          if ! git diff --cached --quiet; then
            if [ "$REF_NAME" != "refs/heads/main" ]; then
              echo "La génération doit être enregistrée sur main."
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Replace catalogue with 175 WPM recordings and remove obsolete speeds"
            git push origin HEAD:main
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare-audio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-audio.outputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Vérifier le lecteur et ses modes
        run: node check.cjs
      - name: Vérifier les morceaux fournis
        run: node check-bundled.cjs
      - name: Vérifier les imports MusicXML
        run: node check-import.cjs
      - name: Vérifier la phonétique
        run: node check-phonetics.cjs
      - name: Vérifier la synthèse locale
        run: node check-local-text.mjs
      - name: Vérifier le time-stretch
        run: node check-tempo-bench.mjs

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [prepare-audio, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-audio.outputs.revision }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v5
